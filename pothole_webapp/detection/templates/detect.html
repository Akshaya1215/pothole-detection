
<!DOCTYPE html>
<html>
<head>
    <title>Pothole Detection System</title>
    <style>
        body { background: #0d0d0d; color: white; font-family: Arial; text-align: center; }
        h1 { font-size: 40px; margin-top: 20px; }
        .icon { font-size: 50px; margin-right: 10px; }
        .container { width: 92%; margin: auto; }
        .row { display: flex; justify-content: space-between; margin-top: 25px; }
        .box { width: 48%; background: #1d1d1d; padding: 15px; border-radius: 14px; box-shadow: 0 0 10px #000; }
        img { width: 100%; border-radius: 14px; }
        button { padding: 10px 30px; font-size: 18px; cursor: pointer; margin-top: 10px; border-radius: 6px; }
        .submit { background: #ff6a00; border: none; color: white; margin-left: 10px; }
        .clear { background: #757575; border: none; color: white; margin-right: 10px; }
        .count-box { background: #1d1d1d; padding: 20px; margin-top: 20px; border-radius: 14px; box-shadow: 0 0 10px #000; }
    </style>
</head>

<body>
<div style="
    background: linear-gradient(90deg, #0e0e0e, #1f1f1f);
    color: #ff6a00;
    width: 100%;
    padding: 12px;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
    border-bottom: 2px solid #ff6a00;
">
    🚧 Smart Road Maintenance System – Pothole Detection AI
</div>
<h1 style="
    font-size: 50px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff8800, #ff2e93, #5b3bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
">
    🚧 Image Pothole Detection
</h1>




    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.image }}
        <br><br>
        <button type="button" class="clear" onclick="window.location.href='/'">Clear</button>
        <button type="submit" class="submit">Submit</button>
    </form>

    {% include 'navbar.html' %}
    {% if result_image %}
    <div class="container">
        <div class="row">
            <div class="box">
                <h3>Uploaded Image</h3>
                <img src="data:image/jpeg;base64,{{ original_image }}" />
            </div>

            <div class="box">
                <h3>Detected Image</h3>
                <img src="data:image/jpeg;base64,{{ result_image }}" />
            </div>
        </div>

        <div class="count-box">
            <h2>Potholes Detected: {{ pothole_count }}</h2>
        </div>
    </div>
    {% endif %}

</body>
</html>
